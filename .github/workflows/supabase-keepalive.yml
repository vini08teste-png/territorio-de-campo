# O plano Free do Supabase pausa o projeto depois de 1 semana sem uso.
# Esta rotina faz uma consulta leve a cada 3 dias para mantê-lo ativo.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar a API REST do Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL e SUPABASE_ANON_KEY não configurados; nada a fazer."
            exit 0
          fi
          curl -fsS "$SUPABASE_URL/rest/v1/configuracoes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null
          echo "Supabase respondeu."
